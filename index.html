      <h1>MTGRP — Metagroupe</h1>
      <p>MTGRP (Metagroupe) is a collaborative architecture practice working at the intersection of metabolism, circularity, thermal conditions, and collective space. Founded in 2018, with offices in Beirut, Madrid, and Milan.</p>
      <h2>Partners</h2>
      <ul>
        <li>Andrew Georges — Co-Founder</li>
        <li>Charbel Abou Chakra — Co-Founder</li>

      <h2>Projects</h2>
      <article>
        <h3>A Well-Tempered House</h3>
        <p>Family Housing — Ghazir, LB</p>
        <p>A house perched on a steep hillside in Ghazir, Lebanon. Deep thermal walls form the structural and spatial logic of the house, while a series of terraces negotiate the steep slope of the site. The house is designed to be passively cooled in summer and passively heated in winter, with a focus on natural ventilation, solar orientation, and thermal mass.</p>
      </article>
      <article>
        <h3>A Home in the Sun</h3>
        <p>Home for Seniors — Lysá nad Labem, CZ</p>
        <p>An elderly care facility organized around the natural circadian rhythm to mitigate the disorientation associated with dementia. The architecture establishes a clear structural dichotomy: a dense, in-situ concrete communal core consolidates daytime collective programs, while prefabricated timber wings hold the private, quiet residential households. Designed as a replicable prototype, the modular kit of parts adapts to two distinct topographies. In Lysá nad Labem, the households are compacted into a three-storey pinwheel forming an urban edge, whereas in Milovice, the same units unfold into a two-storey horizontal arrangement following the gentle slope of the land. The project relies on passive climate strategies, utilizing high thermal mass and cross-ventilation, while the landscape functions as an active therapeutic instrument calibrated to provide temporal and olfactory orientation.</p>
      </article>
      <article>
        <h3>Die Den Gletscher Bewohnen</h3>
        <p>Europan — Winner — St. Gallen, CH</p>
        <p>Winning entry for the Europan competition. The project addresses the geological threshold between molasse and moraine, proposing a model of dwelling that is responsive to the terrain, water, and social change. The glacier is not backdrop but partner — a slow, material presence that shapes the logic of the building.</p>
      </article>
      <article>
        <h3>Holcim Visitor Center</h3>
        <p>Competition Entry — Siggenthal, CH</p>
        <p>Competition entry for the Holcim Visitor Center. Positioned as a precise interface between industrial production and the public, the proposal engages with the material logic of cement. The building acts as a transparent, functional framework rather than a conventional shell, performing its own material origin while physically manifesting the circular economy and flexible, future-proof architectural design.</p>
      </article>
      <article>
        <h3>Santa María de Valdeiglesias</h3>
        <p>Adaptive Reuse — 2nd Prize — Pelayos de la Presa, ES</p>
        <p>Second prize in the competition for the adaptive reuse of the monastery of Santa María de Valdeiglesias. The project negotiates between the preserved fabric of a historic religious complex and a contemporary programme for collective inhabitation — working with rather than against the existing spatial hierarchies of monastic life.</p>
      </article>
      <article>
        <h3>Papushevo Park</h3>
        <p>Urban Development — Papushevo, RU</p>
        <p>An urban development combining a public park, kindergarten, and office buildings. The park is the structuring element of the ensemble, a ground that organises collective life rather than filling residual space between built volumes.</p>
      </article>
      <article>
        <h3>Casa de Aperos</h3>
        <p>Collective Housing — Eivissa, ES</p>
        <p>A proposal for a self-sufficient commune in Eivissa grounded in principles of degrowth and scarcity. Conceived as an adaptable infrastructure stripped to its basic conditions, the project utilizes a proximity modular system constructed from salvaged local demolition materials. Learning from the vernacular Casa Payesa, it adapts traditional mass and passive climate strategies for collective living. The architecture actively engages the user in sustainable practices, functioning alongside an operational manual to reduce traditional energy consumption.</p>
      </article>
      <article>
        <h3>Three Brothers</h3>
        <p>Three Pavilions — Amchit, Lebanon</p>
        <p>Three pavilions for three brothers on the coast of Amchit, Lebanon. Each pavilion is distinct — a singular response to a shared site — while the three together constitute a small domestic landscape on the water's edge.</p>
      </article>
      <article>
        <h3>Salt Nest</h3>
        <p>Adaptive Reuse — Punta Bianca, IT</p>
        <p>Perched on a rugged Sicilian cliff, the Salt Nest breathes new life into an abandoned stone Customs House, transforming a historic relic into an immersive visitor retreat. Embracing principles of material circularity and structural minimalism, the design introduces translucent, geometric roof volumes clad in crystallized salt panels grown sustainably from the surrounding Mediterranean Sea. Inside, the reimagined interior unfolds vertically, hosting a coffee shop, reading nooks, and a layered museum sequence that culminates in a delicate rooftop observation deck suspended between the earth and the sky. Ultimately, the intervention engages in a quiet dialogue with the raw coastal landscape and the ghosts of its past, offering visitors a poetic connection to light, terrain, and the natural elements.</p>
      </article>
      <article>
        <h3>Cárcel Abierta</h3>
        <p>Adaptive Reuse — Talca, CL</p>
        <p>Adaptive reuse of a prison in Chile. The project addresses the conversion of a site of confinement into a structure for collective life — working through the existing spatial order of the penitentiary as an architectural argument about openness and enclosure.</p>
      </article>
      <article>
        <h3>Above All, a Shared Resource</h3>
        <p>Ephemeral Installation — Beirut, LB</p>
        <p>Pliée: A blank piece of paper offers infinite experimentation and as structuralists we began with a fold. Pliée is a wooden structure inspired by the mechanism of simple origami. The folded structure is meant to define its own parameters and create functional spaces on the roof through shading mechanisms while the roof's connection to the sky is defined, intentional, and purposeful while remaining flexible and mobile.</p>
      </article>
      <article>
        <h3>Amchit Fire Proving Grounds</h3>
        <p>Ephemeral Station — Amchit, LB</p>
        <p>A temporary firefighter training station in Amchit, Lebanon — designed to transform into a public park for children once its operational phase is complete. A single structure serving two sequential programmes, using material logic to negotiate the transition between them.</p>
      </article>
      <article>
        <h3>Dancing House</h3>
        <p>Adaptive Reuse &amp; Coliving — Beit Mery, LB</p>
        <p>A collaborative adaptive project for a traditional house in Beit Mery. The existing structure is adapted for a coliving situation with communal activities, and the garden is populated with a series of follies that extend the collective life of the house into the landscape.</p>
      </article>
      <article>
        <h3>RAZ House</h3>
        <p>Interior Design — Aley, LB</p>
        <p>Interior design for a duplex apartment. A wooden box organized life accross two floors.</p>
      </article>
      <article>
        <h3>AM House</h3>
        <p>Interior Design — Nahr Ibrahim, LB</p>
        <p>Interior design for a penthouse. A steel platform forms a mezanine organizing life underneath it.</p>
      </article>

        <h3>GOE Office Extension</h3>
        <p>Interior Design — Beit Chaar, LB</p>
        <p>xxxxxxxxxxx</p>
      </article>
      <article>
        <h3>Baglietto Pavilion</h3>
        <p>Competition — Honourable Mention</p>
        <p>Competition entry for the Baglietto Pavilion, receiving an honourable mention. A proposal exploring temporary structure, public presence, and the architecture of gathering — a single gesture that is simultaneously enclosure and threshold.</p>
      </article>
      <article>
        <h3>KWL — Beirut River</h3>
        <p>Competition — 1st Prize — Beirut, LB</p>
        <p>First prize in the KWL competition. The project reframes the infrastructure of the Beirut River as a site of meeting — proposing that the engineered channel, rather than dividing, can become the basis for a new form of urban public space. Infrastructure as meeting place.</p>
