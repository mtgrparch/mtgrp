<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MTGRP or metagroupe architects is an architecture practice based in Beirut Lebanon, Madrid Spain, and Milan Italy working on housing, villas, adaptive reuse, and urban design. The members are Andrew Georges, Charbel Abou Chacra, Nahi El Khoury and Joe Chamata">
<link rel="icon" href="photos/FAVICON/favicon.ico">
<title>MTGRP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --blue:  #0033FF;
  --grey:  #888;
  --faint: #ccc;
  --karla:    'Karla', sans-serif;
  --garamond: 'EB Garamond', serif;
}
html, body { height: 100%; }
body {
  background: var(--white);
  color: var(--black);
  font-family: var(--garamond);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* grid backdrop */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.045) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ── PLAN IMAGE SLIDESHOW ── */
.landing-plan-wrap {
  position: fixed;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  width: 100vw;
  height: 80vh;
  z-index: 1;
  pointer-events: none;
}

.landing-plan {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}
.landing-plan.active { opacity: 1; }

/* ── MAIN ── */
main {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px;
  min-height: 0;
  pointer-events: none;
}
main * { pointer-events: auto; }

.land-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.land-brand {
  font-family: var(--karla);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--black);
}
.land-year {
  font-family: var(--garamond);
  font-style: italic;
  font-size: 13px;
  color: var(--grey);
}

.land-center {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  flex: 1;
  justify-content: center;
  padding: 32px 0;
}

/*
  BLEND TECHNIQUE:
  The logo sits inside a positioned wrapper with mix-blend-mode: multiply.
  We paint the text white on a black rectangle.
  multiply blend: white areas let the plan show through normally,
  but the white text shape "erases" the plan lines beneath it to white —
  exactly the negative/cutout effect from the GIF.
  
  Actually simplest correct approach:
  Keep logo black. Place a full-size white overlay with mix-blend-mode: difference
  BEHIND the text but ABOVE the plans — this inverts the plans everywhere,
  then the black logo acts as a mask that punches back through.
  
  Cleanest native approach: use mix-blend-mode: exclusion on the logo itself,
  color: white. On white bg = invisible. So instead:
  
  CORRECT APPROACH:
  - Logo text color: black (visible on white bg)
  - The plan images use mix-blend-mode: multiply on a black background layer
    so where plans are white they let the bg show, where lines exist they show dark
  - Then logo with mix-blend-mode: difference + color white:
    over white bg (plan background) = black (readable)
    over dark plan lines = inverted to white (lines disappear inside letters)
    
  This IS the correct setup — the logo just needs a non-white page bg.
  Set body bg to black, plans multiply, logo difference+white.
  But that changes the whole page aesthetic.
  
  SIMPLEST that matches the GIF exactly without changing aesthetics:
  Absolute-position a canvas/svg over the logo area and do pixel blending there.
  
  OR — just use the logo as a PNG overlay with mix-blend-mode: difference
  placed absolutely over the plans at z-index 3.
*/

/* 
  FINAL WORKING APPROACH:
  Logo wrapper creates a new stacking context.
  Logo text is black — visible on white background (normal).
  We place the plans INSIDE the logo stacking context via a pseudo-element
  so the blend applies correctly within the isolated layer.
  
  Actually the simplest that works: 
  Set the .land-logo-wrap to position:relative, isolation:isolate
  Clone the plan images inside it absolutely positioned.
  Logo text uses mix-blend-mode: difference, color: white.
  Within the isolated context: white text + difference over the plan images
  = inverted plan lines show white inside letters, black outside = perfect.
*/

.land-logo-wrap {
  position: relative;
  display: inline-block;
  isolation: isolate;   /* NEW stacking context — blend is scoped here */
}

/* Plan images cloned inside the logo wrap via JS — see script */
.land-logo-wrap .plan-clone {
  position: absolute;
  inset: -200px -60px; /* bleed beyond the text a bit */
  object-fit: contain;
  object-position: left center;
  opacity: 0;
  transition: opacity 1s ease-in-out;
  pointer-events: none;
  z-index: 0;
}
.land-logo-wrap .plan-clone.active { opacity: 1; }

a.land-logo {
  position: relative;
  z-index: 1;
  font-family: var(--karla);
  font-weight: 700;
  font-size: clamp(88px, 16vw, 220px);
  line-height: 0.88;
  letter-spacing: -0.03em;
  text-decoration: none;
  display: block;
  cursor: pointer;
  /* difference blend with white text:
     white over white bg = black (logo readable)
     white over dark line = inverted to white (line disappears inside letter) */
  color: white;
  mix-blend-mode: difference;
  transition: color 0.15s;
}
a.land-logo:hover { color: #0033FF; }

.land-desc {
  margin-top: 32px;
  font-family: var(--garamond);
  font-size: clamp(15px, 1.4vw, 18px);
  line-height: 1.65;
  color: var(--grey);
  max-width: 520px;
}

/* ── FOOTER ── */
footer {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 40px;
}
.footer-cities {
  font-family: var(--garamond);
  font-style: italic;
  font-size: 13px;
  color: var(--faint);
  letter-spacing: 0.04em;
}

@media (max-width: 600px) {
  main { padding: 24px 20px; }
  footer { padding: 14px 20px; }
  .landing-plan-wrap { height: 60vh; }
}
</style>
</head>
<body>

<!-- Background plan slideshow (decorative, full page) -->
<div class="landing-plan-wrap" id="plan-wrap">
  <img src="photos/plan-01.png" class="landing-plan active" alt="">
  <img src="photos/plan-02.png" class="landing-plan" alt="">
  <img src="photos/plan-03.png" class="landing-plan" alt="">
  <img src="photos/plan-04.png" class="landing-plan" alt="">
  <img src="photos/plan-05.png" class="landing-plan" alt="">
  <img src="photos/plan-06.png" class="landing-plan" alt="">
  <img src="photos/plan-07.png" class="landing-plan" alt="">
  <img src="photos/plan-08.png" class="landing-plan" alt="">
  <img src="photos/plan-10.png" class="landing-plan" alt="">
</div>

<main>
  <div class="land-top">
    <span class="land-brand">MTGRP</span>
    <span class="land-year">Est. 2018</span>
  </div>

  <div class="land-center">
    <!-- Isolated wrapper: plan clones + blended logo live here -->
    <div class="land-logo-wrap" id="logo-wrap">
      <a class="land-logo" href="work.html" aria-label="Enter site — go to Work">MTGRP</a>
    </div>
    <p class="land-desc">Architecture concerned with metabolism and circularity — a political approach to temperature, material expression, and collective use. We are interested in the spaces in between.</p>
  </div>
</main>

<footer>
  <span class="footer-cities">Beirut &nbsp;&mdash;&nbsp; Milan &nbsp;&mdash;&nbsp; Madrid</span>
</footer>

<script>
const planSrcs = [
  'photos/plan-01.png','photos/plan-02.png','photos/plan-03.png',
  'photos/plan-04.png','photos/plan-05.png','photos/plan-06.png',
  'photos/plan-07.png','photos/plan-08.png','photos/plan-10.png'
];

const bgWrap  = document.getElementById('plan-wrap');
const logoWrap = document.getElementById('logo-wrap');
const bgSlides = bgWrap.querySelectorAll('.landing-plan');

// Clone plan images into the logo wrap so blend is isolated
const clones = planSrcs.map((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.className = 'plan-clone' + (i === 0 ? ' active' : '');
  img.alt = '';
  logoWrap.insertBefore(img, logoWrap.firstChild);
  return img;
});

let current = 0;

if (planSrcs.length > 1) {
  setInterval(() => {
    // Advance background
    bgSlides[current].classList.remove('active');
    clones[current].classList.remove('active');

    current = (current + 1) % planSrcs.length;

    bgSlides[current].classList.add('active');
    clones[current].classList.add('active');
  }, 3000);
}
</script>

</body>
</html>
