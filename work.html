<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="photos/FAVICON/favicon.ico">
<title>MTGRP — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --blue:  #0033FF;
  --grey:  #888;
  --faint: #ccc;
  --karla:    'Karla', sans-serif;
  --garamond: 'EB Garamond', serif;
}
html { scroll-behavior: smooth; }
body {
  background: var(--white);
  color: var(--black);
  font-family: var(--garamond);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
body::before {
  content: '';
  position: fixed;
  inset: 0; z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
}
nav, main, footer { position: relative; z-index: 1; }

nav {
  position: sticky; top: 0;
  background: var(--white);
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 40px; z-index: 100;
}
.nav-logo {
  font-family: var(--karla); font-size: 15px; font-weight: 700;
  letter-spacing: 0.08em; color: var(--black); text-decoration: none;
}
.nav-logo:hover { color: var(--blue); }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a {
  font-family: var(--garamond); font-style: italic; font-size: 16px;
  color: var(--grey); text-decoration: none; transition: color 0.15s;
}
.nav-links a:hover, .nav-links a.active { color: var(--blue); }

main { flex: 1; padding-top: 48px; }

.page-title {
  font-family: var(--karla); font-size: 11px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--grey); padding: 0 40px 20px;
}

.project-row {
  display: grid;
  grid-template-columns: 44px 1fr 180px 80px;
  align-items: baseline;
  padding: 15px 40px;
  border-top: 1px solid #eee;
  text-decoration: none;
  color: var(--black);
  transition: background 0.1s;
}
.project-row:last-child { border-bottom: 1px solid #eee; }
.project-row:hover { background: #f5f5f5; }
.project-row:hover .p-name { color: var(--blue); }

.p-num {
  font-family: var(--karla); font-size: 11px;
  color: var(--faint); letter-spacing: 0.08em; padding-top: 3px;
}
.p-name {
  font-family: var(--garamond);
  font-size: clamp(17px, 1.9vw, 23px);
  line-height: 1.2; transition: color 0.15s;
}
.p-name em { font-style: italic; color: var(--grey); font-size: 0.82em; }
.p-type {
  font-family: var(--garamond); font-style: italic;
  font-size: 13px; color: var(--grey); text-align: right;
}
.p-loc {
  font-family: var(--karla); font-size: 11px;
  color: var(--faint); text-align: right; letter-spacing: 0.05em;
}

footer {
  display: flex; align-items: center; justify-content: center;
  padding: 20px 40px; margin-top: 40px;
}
.footer-cities {
  font-family: var(--garamond); font-style: italic;
  font-size: 13px; color: var(--faint); letter-spacing: 0.04em;
}

@media (max-width: 720px) {
  nav { padding: 14px 20px; }
  main { padding-top: 32px; }
  .page-title { padding: 0 20px 16px; }
  .project-row { grid-template-columns: 36px 1fr 80px; padding: 14px 20px; }
  .p-loc { display: none; }
  footer { padding: 16px 20px; }
}
a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">MTGRP</a>
  <ul class="nav-links">
    <li><a href="work.html" class="active">Work</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<main>
  <p class="page-title">Work</p>
  <div id="project-list"></div>
</main>

<footer>
  <span class="footer-cities">Beirut &nbsp;&mdash;&nbsp; Madrid &nbsp;&mdash;&nbsp; Milan</span>
</footer>

<script src="projects.js"></script>
<script>
  const list = document.getElementById('project-list');

  PROJECTS.forEach((p, i) => {
    const a = document.createElement('a');
    a.className = 'project-row';
    a.href = `projects/project.html?id=${p.id}`;
    a.innerHTML = `
      <span class="p-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="p-name">${p.title}${p.subtitle ? ` <em>— ${p.subtitle}</em>` : ''}</span>
      <span class="p-type">${p.type}</span>
      <span class="p-loc">${p.location}</span>
    `;
    list.appendChild(a);
  });

  document.querySelector('.page-title').textContent = `Work — ${PROJECTS.length} projects`;
</script>

</body>
</html>
