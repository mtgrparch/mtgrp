<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTGRP — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --blue:  #0033FF;
  --grey:  #888;
  --faint: #ccc;
  --karla:    'Karla', sans-serif;
  --garamond: 'EB Garamond', serif;
}
html, body { height: 100%; }
body {
  background: var(--white);
  color: var(--black);
  font-family: var(--garamond);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.045) 1px, transparent 1px);
  background-size: 48px 48px;
}
nav, main, footer { position: relative; z-index: 1; }

/* ── NAV ───────────────────────────────── */
nav {
  position: sticky; top: 0;
  background: var(--white);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 40px;
  z-index: 100;
}
.nav-logo {
  font-family: var(--karla);
  font-size: 15px; font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--black); text-decoration: none;
}
.nav-logo:hover { color: var(--blue); }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a {
  font-family: var(--garamond);
  font-style: italic; font-size: 16px;
  color: var(--grey); text-decoration: none;
  transition: color 0.15s;
}
.nav-links a:hover, .nav-links a.active { color: var(--blue); }

/* ── MAIN ───────────────────────────────── */
main {
  flex: 1;
  padding: 48px 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-content: start;
  gap: 0;
}

.contact-left { padding-right: 80px; }

.page-title {
  font-family: var(--karla);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--grey); margin-bottom: 40px;
}

.contact-headline {
  font-family: var(--garamond);
  font-size: clamp(28px, 4vw, 52px);
  font-weight: 400;
  line-height: 1.15;
  color: var(--black);
  margin-bottom: 36px;
}

.email-link {
  font-family: var(--karla);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--blue);
  text-decoration: none;
  border-bottom: 1px solid var(--blue);
  padding-bottom: 2px;
  transition: opacity 0.15s;
  display: inline-block;
}
.email-link:hover { opacity: 0.55; }

.contact-right {
  padding-top: 52px; /* align with headline */
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.cf label {
  display: block;
  font-family: var(--karla);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 5px;
}
.cf p {
  font-family: var(--garamond);
  font-size: 16px;
  line-height: 1.6;
  color: var(--grey);
}
.cf a {
  color: var(--blue);
  text-decoration: none;
}
.cf a:hover { text-decoration: underline; }

/* ── FOOTER ────────────────────────────── */
footer {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 40px;
}
.footer-cities {
  font-family: var(--garamond);
  font-style: italic;
  font-size: 13px;
  color: var(--faint);
  letter-spacing: 0.04em;
}

/* ── MOBILE ────────────────────────────── */
@media (max-width: 720px) {
  nav { padding: 14px 20px; }
  main { padding: 32px 20px; grid-template-columns: 1fr; }
  .contact-left { padding-right: 0; margin-bottom: 48px; }
  .contact-right { padding-top: 0; }
  footer { padding: 16px 20px; }
}
a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">MTGRP</a>
  <ul class="nav-links">
    <li><a href="work.html">Work</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="contact-left">
    <p class="page-title">Contact</p>
    <h1 class="contact-headline">Get in<br>touch.</h1>
    <a href="mailto:contact@mtgrp.com" class="email-link">contact@mtgrp.com</a>
  </div>

  <div class="contact-right">
    <div class="cf">
      <label>Beirut</label>
      <p>Lebanon</p>
    </div>
    <div class="cf">
      <label>Madrid</label>
      <p>Spain</p>
    </div>
    <div class="cf">
      <label>Milan</label>
      <p>Italy</p>
    </div>
    <div class="cf">
      <label>Instagram</label>
      <p><a href="https://www.instagram.com/metagroupe/" target="_blank" rel="noopener">@metagroupe</a></p>
    </div>
  </div>
</main>

<footer>
  <span class="footer-cities">Beirut &nbsp;&mdash;&nbsp; Madrid &nbsp;&mdash;&nbsp; Milan</span>
</footer>

</body>
</html>
