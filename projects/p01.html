<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTGRP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../project.css">
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">MTGRP</a>
  <ul class="nav-links">
    <li><a href="../work.html">Work</a></li>
    <li><a href="../about.html">About</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div class="layout">
  <aside class="sidebar">
    <a href="../work.html" class="back-link"><span class="back-arrow">&#8592;</span> All Work</a>
    <h1 class="proj-title" id="s-title"></h1>
    <p class="proj-subtitle" id="s-subtitle"></p>
    <p class="proj-desc" id="s-desc"></p>
    <dl class="meta">
      <div class="meta-row"><dt class="meta-key">Location</dt><dd class="meta-val" id="s-location"></dd></div>
      <div class="meta-row"><dt class="meta-key">Type</dt><dd class="meta-val" id="s-type"></dd></div>
      <div class="meta-row"><dt class="meta-key">Size</dt><dd class="meta-val" id="s-size"></dd></div>
      <div class="meta-row"><dt class="meta-key">Budget</dt><dd class="meta-val" id="s-budget"></dd></div>
      <div class="meta-row"><dt class="meta-key">Status</dt><dd class="meta-val" id="s-status"></dd></div>
    </dl>
  </aside>

  <div class="image-field">
    <div class="images-wrap" id="image-wrap"></div>
  </div>
</div>

<footer>
  <span class="footer-cities">Beirut &nbsp;&mdash;&nbsp; Madrid &nbsp;&mdash;&nbsp; Milan</span>
</footer>

<script src="../projects.js"></script>
<script>
  const pageId = location.pathname.split('/').pop().replace('.html', '');
  const project = PROJECTS.find(p => p.id === pageId);

  if (project) {
    document.title = `MTGRP — ${project.title}`;
    document.getElementById('s-title').textContent    = project.title;
    document.getElementById('s-subtitle').textContent = project.subtitle;
    document.getElementById('s-desc').textContent     = project.desc;
    document.getElementById('s-location').textContent = project.location;
    document.getElementById('s-type').textContent     = project.type;
    document.getElementById('s-size').textContent     = project.size;
    document.getElementById('s-budget').textContent   = project.budget;
    document.getElementById('s-status').textContent   = project.status;

    const wrap = document.getElementById('image-wrap');
    for (let i = 1; i <= project.photos; i++) {
      const num = String(i).padStart(2, '0');
      wrap.innerHTML += `
        <div class="img-block">
          <!--
            TO ADD A REAL PHOTO — replace the div.photo-ph with:
            <img src="../photos/${project.id}-${num}.jpg"
                 style="width:100%;display:block;object-fit:cover;">
          -->
          <div class="photo-ph">Photo ${i}</div>
        </div>`;
    }
  }
</script>
</body>
</html>
