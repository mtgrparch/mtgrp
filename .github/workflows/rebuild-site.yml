# Rebuilds the generated parts of the site whenever projects or photos change
# on main, then commits the result — so editing script.js or uploading photos
# on github.com is all that's needed.
#
#   • photos/        oversized uploads shrunk to web size (tools/resize_photos.py)
#   • photos/grid/   small grid tiles          (tools/make_grid_tiles.py)
#   • photos/og/     link-preview images       (tools/make_og_images.py)
#   • projects/, sitemap.xml, llms.txt, search data in index.html,
#     ?v= cache versions                       (tools/build_seo.js)
#
# Can also be run by hand: Actions tab → "Rebuild site" → Run workflow.

name: Rebuild site

on:
  push:
    branches: [main]
    paths:
      - script.js
      - style.css
      - index.html
      - photos/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install pillow

      # A fresh checkout gives every file the same timestamp, so tell the
      # tile script which photos are actually new: existing tiles count as
      # up to date, photos changed in this push count as newer.
      - name: Mark changed photos
        run: |
          touch photos/grid/* 2>/dev/null || true
          sleep 1
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD -- photos ':!photos/grid' ':!photos/og' | while read -r f; do
              [ -f "$f" ] || continue
              touch "$f"
              # a new first photo means a new link preview
              case "$f" in photos/*-01.*) rm -f "photos/og/$(basename "$f" | sed 's/-01\..*//').jpg" ;; esac
            done
          fi

      - run: python tools/resize_photos.py
      - run: python tools/make_grid_tiles.py
      - run: python tools/make_og_images.py
      - run: node tools/build_seo.js

      - name: Commit changes
        run: |
          git add -A photos projects index.html sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild generated site files"
          git pull --rebase origin main
          git push origin HEAD:main
